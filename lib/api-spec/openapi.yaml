openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Signed-in account identity
  - name: conversations
    description: Account-owned conversation and message persistence
  - name: stored-documents
    description: Account-owned PDF storage
  - name: simplification
    description: Plain-language text generation
  - name: document-extraction
    description: PDF text, table, and image extraction
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guest-chat:
    post:
      operationId: sendGuestChatTurn
      tags: [guest-chat]
      summary: Send a turn in an anonymous chat
      description: Generates a reply from the provided conversation history without storing it on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestChatResponse"
        "400":
          description: Invalid chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The assistant returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The assistant service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account:
    get:
      operationId: getAccountIdentity
      tags: [account]
      summary: Get the signed-in account identity
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: Current account identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountIdentity"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the signed-in user's conversations
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: User-owned conversations, newest activity first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation for the signed-in user
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreatePayload"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameConversation
      tags: [conversations]
      summary: Rename a user-owned conversation
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRenamePayload"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation, its messages, and its stored PDFs
      security:
        - ClerkSessionCookie: []
      responses:
        "204":
          description: Conversation and associated data deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Stored PDF cleanup failed; conversation was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages in a user-owned conversation
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: Conversation messages in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addConversationMessage
      tags: [conversations]
      summary: Store a user message in a user-owned conversation
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: User message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}/chat:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendConversationChatTurn
      tags: [conversations]
      summary: Send a message and receive a saved assistant reply
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: User and assistant messages saved in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          description: Invalid chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The assistant returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The assistant service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents:
    get:
      operationId: listStoredDocuments
      tags: [stored-documents]
      summary: List the signed-in user's saved PDFs
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: User-owned saved PDFs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredDocumentList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/upload-url:
    post:
      operationId: requestStoredDocumentUpload
      tags: [stored-documents]
      summary: Create a private PDF upload slot for the signed-in user
      description: Returns a short-lived upload URL. The file is not available until the upload is completed and verified.
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDocumentUploadBody"
      responses:
        "201":
          description: Upload slot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadTicket"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: PDF exceeds the 12 MiB storage limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/{documentId}/complete:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: completeStoredDocumentUpload
      tags: [stored-documents]
      summary: Verify and finalize a PDF upload
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: Verified saved PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredDocument"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Upload slot or uploaded object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Uploaded file does not match the requested PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/{documentId}/file:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStoredDocumentFile
      tags: [stored-documents]
      summary: Read a private PDF owned by the signed-in user
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Saved PDF not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteStoredDocument
      tags: [stored-documents]
      summary: Delete a saved PDF and its private object
      security:
        - ClerkSessionCookie: []
      responses:
        "204":
          description: Saved PDF deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Saved PDF not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: PDF cleanup failed; metadata was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /simplify:
    post:
      operationId: simplifyText
      tags: [simplification]
      summary: Simplify pasted text with Grok
      description: Rewrites the supplied text using the user's plain-language prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimplifyInput"
      responses:
        "200":
          description: Simplified text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimplifyResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Prepared PDF content exceeds the character limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The Grok API returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Grok API is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/simplification-jobs:
    post:
      operationId: startDocumentSimplificationJob
      tags: [simplification]
      summary: Start a streamed PDF simplification job
      description: Starts an ordered PDF rewrite and returns a job ID for receiving progress and completed sections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimplifyInput"
      responses:
        "202":
          description: Simplification job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSimplificationJobCreated"
        "400":
          description: Invalid simplification input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Prepared PDF content exceeds the character limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many PDF simplification jobs are already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Grok API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/simplification-jobs/{jobId}/events:
    get:
      operationId: streamDocumentSimplificationJob
      tags: [simplification]
      summary: Receive PDF simplification progress
      description: Streams ordered progress events, completed sections, and final results. Reconnects replay events after the last received event ID.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent progress events
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Simplification job not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/extract:
    post:
      operationId: extractPdfDocument
      tags: [document-extraction]
      summary: Extract reviewable content from a PDF
      description: Extracts selectable text, OCR text from scans and embedded images, tables, and image previews while excluding index pages, page-number text, and author bylines on the first and last pages.
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Extracted PDF content for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentExtraction"
        "400":
          description: The request is not a valid PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The PDF exceeds processing limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The PDF has no readable content or cannot be processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    ClerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    AccountIdentity:
      type: object
      properties:
        userId:
          type: string
      required: [userId]
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, createdAt, updatedAt]
    ConversationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      required: [items]
    ConversationCreatePayload:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    ConversationRenamePayload:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required: [title]
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]
    MessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required: [items]
    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 30000
      required: [content]
    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 6000
      required: [content]
    GuestChatMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 6000
      required: [role, content]
    GuestChatInput:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/GuestChatMessage"
      required: [messages]
    GuestChatResponse:
      type: object
      properties:
        content:
          type: string
      required: [content]
    StoredDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: [string, "null"]
          format: uuid
        fileName:
          type: string
        contentType:
          type: string
          const: application/pdf
        byteSize:
          type: integer
        status:
          type: string
          enum: [pending_upload, ready, failed]
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, fileName, contentType, byteSize, status, createdAt]
    StoredDocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoredDocument"
      required: [items]
    RequestDocumentUploadBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 12582912
        contentType:
          type: string
          const: application/pdf
        conversationId:
          type: [string, "null"]
          format: uuid
      required: [name, size, contentType]
    DocumentUploadTicket:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        objectPath:
          type: string
        uploadURL:
          type: string
          format: uri
      required: [documentId, objectPath, uploadURL]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SimplifyInput:
      type: object
      properties:
        sourceText:
          type: string
          minLength: 1
          maxLength: 100000
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        documentMode:
          type: boolean
          description: Processes PDF content in ordered chunks and returns rewritten tables separately.
        tables:
          type: array
          maxItems: 150
          items:
            $ref: "#/components/schemas/DocumentTable"
      required:
        - sourceText
        - prompt
    SimplifyResult:
      type: object
      properties:
        result:
          type: string
        model:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTable"
        unchangedTables:
          type: array
          items:
            type: string
      required:
        - result
        - model
    DocumentSimplificationJobCreated:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued]
      required:
        - jobId
        - status
    DocumentTable:
      type: object
      properties:
        token:
          type: string
          pattern: "^\\[\\[SOURCE_TABLE_\\d+\\]\\]$"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
      required:
        - token
        - rows
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DocumentExtraction:
      type: object
      properties:
        fileName:
          type: string
        pageCount:
          type: integer
        extractedText:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBlock"
        mainContentStart:
          $ref: "#/components/schemas/MainContentStart"
        summary:
          $ref: "#/components/schemas/DocumentExtractionSummary"
      required:
        - fileName
        - pageCount
        - extractedText
        - blocks
        - mainContentStart
        - summary
    MainContentStart:
      type: object
      properties:
        confidence:
          type: string
          enum: [high, review, not_found]
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MainContentStartCandidate"
      required:
        - confidence
        - candidates
    MainContentStartCandidate:
      type: object
      properties:
        sequence:
          type: integer
        pageIndex:
          type: integer
          description: Zero-based physical page position within the PDF.
        offset:
          type: integer
          description: Character offset within the text block where the heading begins.
        heading:
          type: string
      required:
        - sequence
        - pageIndex
        - offset
        - heading
    DocumentBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text, table, image]
        sequence:
          type: integer
        pageIndex:
          type: integer
          description: Zero-based source position used only to retain block order; never included in extractedText.
        text:
          type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        imageDataUrl:
          type: string
          format: uri
        imageMimeType:
          type: string
        imageWidth:
          type: integer
        imageHeight:
          type: integer
        isOcr:
          type: boolean
          description: True when the text block was recognized from a scanned page or embedded image.
        ocrConfidence:
          type: number
          minimum: 0
          maximum: 100
        lowConfidenceOcr:
          type: boolean
          description: True when OCR confidence is below the review threshold.
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: Bounding box in PDF points, retained for future document reconstruction.
      required:
        - type
        - sequence
        - pageIndex
    DocumentExtractionSummary:
      type: object
      properties:
        skippedIndexPages:
          type: integer
        removedPageNumberLines:
          type: integer
        removedAuthorBylines:
          type: integer
        imageCount:
          type: integer
        tableCount:
          type: integer
        ocrPageCount:
          type: integer
        ocrLineCount:
          type: integer
        lowConfidenceOcrLines:
          type: integer
        ocrFailedPageCount:
          type: integer
      required:
        - skippedIndexPages
        - removedPageNumberLines
        - removedAuthorBylines
        - imageCount
        - tableCount
        - ocrPageCount
        - ocrLineCount
