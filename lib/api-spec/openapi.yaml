openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simplification
    description: Plain-language text generation
  - name: document-extraction
    description: PDF text, table, and image extraction
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /simplify:
    post:
      operationId: simplifyText
      tags: [simplification]
      summary: Simplify pasted text with Grok
      description: Rewrites the supplied text using the user's plain-language prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimplifyInput"
      responses:
        "200":
          description: Simplified text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimplifyResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Prepared PDF content exceeds the character limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The Grok API returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Grok API is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents/extract:
    post:
      operationId: extractPdfDocument
      tags: [document-extraction]
      summary: Extract reviewable content from a PDF
      description: Extracts selectable text, OCR text from scans and embedded images, tables, and image previews while excluding index pages, page-number text, and author bylines on the first and last pages.
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Extracted PDF content for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentExtraction"
        "400":
          description: The request is not a valid PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The PDF exceeds processing limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The PDF has no readable content or cannot be processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SimplifyInput:
      type: object
      properties:
        sourceText:
          type: string
          minLength: 1
          maxLength: 100000
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        documentMode:
          type: boolean
          description: Processes PDF content in ordered chunks and returns rewritten tables separately.
        tables:
          type: array
          maxItems: 150
          items:
            $ref: "#/components/schemas/DocumentTable"
      required:
        - sourceText
        - prompt
    SimplifyResult:
      type: object
      properties:
        result:
          type: string
        model:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTable"
        unchangedTables:
          type: array
          items:
            type: string
      required:
        - result
        - model
    DocumentTable:
      type: object
      properties:
        token:
          type: string
          pattern: "^\\[\\[SOURCE_TABLE_\\d+\\]\\]$"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
      required:
        - token
        - rows
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DocumentExtraction:
      type: object
      properties:
        fileName:
          type: string
        pageCount:
          type: integer
        extractedText:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBlock"
        summary:
          $ref: "#/components/schemas/DocumentExtractionSummary"
      required:
        - fileName
        - pageCount
        - extractedText
        - blocks
        - summary
    DocumentBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text, table, image]
        sequence:
          type: integer
        pageIndex:
          type: integer
          description: Zero-based source position used only to retain block order; never included in extractedText.
        text:
          type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        imageDataUrl:
          type: string
          format: uri
        imageMimeType:
          type: string
        imageWidth:
          type: integer
        imageHeight:
          type: integer
        isOcr:
          type: boolean
          description: True when the text block was recognized from a scanned page or embedded image.
        ocrConfidence:
          type: number
          minimum: 0
          maximum: 100
        lowConfidenceOcr:
          type: boolean
          description: True when OCR confidence is below the review threshold.
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: Bounding box in PDF points, retained for future document reconstruction.
      required:
        - type
        - sequence
        - pageIndex
    DocumentExtractionSummary:
      type: object
      properties:
        skippedIndexPages:
          type: integer
        removedPageNumberLines:
          type: integer
        removedAuthorBylines:
          type: integer
        imageCount:
          type: integer
        tableCount:
          type: integer
        ocrPageCount:
          type: integer
        ocrLineCount:
          type: integer
        lowConfidenceOcrLines:
          type: integer
        ocrFailedPageCount:
          type: integer
      required:
        - skippedIndexPages
        - removedPageNumberLines
        - removedAuthorBylines
        - imageCount
        - tableCount
        - ocrPageCount
        - ocrLineCount
        - lowConfidenceOcrLines
        - ocrFailedPageCount

