openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Signed-in account identity
  - name: conversations
    description: Account-owned conversation and message persistence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guest-chat:
    post:
      operationId: sendGuestChatTurn
      tags: [guest-chat]
      summary: Send a turn in an anonymous chat
      description: "Generates a reply from the provided conversation history without storing it on the server. Send requests with Accept: text/event-stream for incremental events; JSON is the default."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestChatInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GuestChatMultipartInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestChatResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "400":
          description: Invalid chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The assistant returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The assistant service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /account:
    get:
      operationId: getAccountIdentity
      tags: [account]
      summary: Get the signed-in account identity
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: Current account identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountIdentity"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the signed-in user's conversations
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: User-owned conversations, newest activity first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation for the signed-in user
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreatePayload"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/import-guest:
    post:
      operationId: importGuestConversation
      tags: [conversations]
      summary: Copy a guest conversation into the signed-in user's account
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestConversationImportInput"
      responses:
        "201":
          description: Guest conversation copied, or the existing conversation returned for an identical retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid guest conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The identifier belongs to another account or the stored conversation does not match; no stored conversation data is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameConversation
      tags: [conversations]
      summary: Rename a user-owned conversation
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRenamePayload"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation, its messages, and any associated legacy files
      security:
        - ClerkSessionCookie: []
      responses:
        "204":
          description: Conversation and associated data deleted
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Cleanup of an associated legacy file failed; conversation was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages in a user-owned conversation
      security:
        - ClerkSessionCookie: []
      responses:
        "200":
          description: Conversation messages in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addConversationMessage
      tags: [conversations]
      summary: Store a user message in a user-owned conversation
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: User message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /conversations/{conversationId}/chat:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendConversationChatTurn
      tags: [conversations]
      summary: Send a message and receive a saved assistant reply
      description: "Send requests with Accept: text/event-stream for incremental events; JSON is the default."
      security:
        - ClerkSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ChatMessageMultipartInput"
      responses:
        "201":
          description: User and assistant messages saved in creation order, returned as JSON or incremental events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "400":
          description: Invalid chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The assistant returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The assistant service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    ClerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    AccountIdentity:
      type: object
      properties:
        userId:
          type: string
      required: [userId]
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, title, createdAt, updatedAt]
    ConversationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      required: [items]
    ConversationCreatePayload:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    ConversationRenamePayload:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required: [title]
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]
    MessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required: [items]
    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 30000
      required: [content]
    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 6000
        createIfMissing:
          type: boolean
          description: Create and save a new account conversation with its first completed turn if the identifier does not exist.
      required: [content]
    GuestConversationImportMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 30000
      required: [role, content]
    GuestConversationImportInput:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        messages:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/GuestConversationImportMessage"
      required: [id, title, messages]
    GuestChatMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 6000
      required: [role, content]
    GuestChatInput:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/GuestChatMessage"
      required: [messages]
    GuestChatMultipartInput:
      type: object
      properties:
        messages:
          type: string
          description: JSON-serialized guest chat history.
        files:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
      required: [messages, files]
    ChatMessageMultipartInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 6000
        createIfMissing:
          type: string
          enum: ["true", "false"]
        files:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
      required: [content, files]
    GuestChatResponse:
      type: object
      properties:
        content:
          type: string
      required: [content]
    ChatStreamEvent:
      description: A JSON event sent as a data field in a server-sent event stream.
      oneOf:
        - $ref: "#/components/schemas/ChatStreamDelta"
        - $ref: "#/components/schemas/ChatStreamDone"
        - $ref: "#/components/schemas/ChatStreamError"
    ChatStreamDelta:
      type: object
      properties:
        type:
          type: string
          const: delta
        content:
          type: string
      required: [type, content]
    ChatStreamDone:
      type: object
      properties:
        type:
          type: string
          const: done
        content:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required: [type, content]
    ChatStreamError:
      type: object
      properties:
        type:
          type: string
          const: error
        error:
          type: string
      required: [type, error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

