openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: simplification
    description: Plain-language text generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /simplify:
    post:
      operationId: simplifyText
      tags: [simplification]
      summary: Simplify pasted text with Grok
      description: Rewrites the supplied text using the user's plain-language prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimplifyInput"
      responses:
        "200":
          description: Simplified text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimplifyResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The Grok API returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Grok API is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SimplifyInput:
      type: object
      properties:
        sourceText:
          type: string
          minLength: 1
          maxLength: 60000
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - sourceText
        - prompt
    SimplifyResult:
      type: object
      properties:
        result:
          type: string
        model:
          type: string
      required:
        - result
        - model
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

