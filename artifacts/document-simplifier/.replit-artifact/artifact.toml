kind = "web"
previewPath = "/"
title = "Easy Peasy Docs"
description = "An open-ended chat for anyone, with a separate signed-in workspace for saved conversations and PDF review."
version = "1.0.0"
id = "artifacts/document-simplifier"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23322

[services.development]
run = "pnpm --filter @workspace/document-simplifier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/document-simplifier", "run", "build" ]
serve = "static"
publicDir = "artifacts/document-simplifier/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23322"
BASE_PATH = "/"
